services:
  postgres:
    image: postgres:16
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_USER: sismos
      POSTGRES_PASSWORD: sismos
      POSTGRES_DB: sismos
    volumes:
      - /mnt/data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sismos -d sismos"]
      interval: 10s
      timeout: 5s
      retries: 5

  daemon:
    # For local dev this builds on the fly. Production on the Pi should
    # instead pull a prebuilt image, per the buildx workflow in
    # CLAUDE.md (build on another machine, push, then `image:` here).
    build:
      context: ../daemon
      dockerfile: Dockerfile
    platform: linux/arm64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sismos:sismos@postgres:5432/sismos
      # infra/postgres/init isn't part of the daemon's own build context
      # (see Dockerfile), so it's mounted read-only instead -- same source
      # files the postgres service's docker-entrypoint-initdb.d uses,
      # single source of truth for both. See daemon/migrations.py.
      # Mounted outside /app (not /app/migrations): docker-compose.override.yml
      # bind-mounts the whole daemon/ dir at /app for local dev, and nesting
      # this mount under that one made Docker auto-create an empty,
      # root-owned daemon/migrations/ dir on the host as a mountpoint. See
      # the volumes entry below and README.md.
      MIGRATIONS_DIR: /migrations
      # See daemon/alerts.py. The `ntfy` service below runs
      # auth-default-access=deny-all, so NTFY_TOKEN is required for
      # notifications to actually go out -- see infra/ntfy-setup.sh for the
      # one-time bootstrap that creates it. NTFY_TOKEN itself comes from
      # infra/.env (gitignored, not this file) via docker compose's
      # automatic ${VAR} substitution -- never hardcode the real token here.
      # Defaults to empty rather than failing compose outright (rule 4:
      # graceful degradation) -- before ntfy-setup.sh has run, the daemon
      # still starts and ingests normally, it just logs a warning on every
      # notification attempt instead of sending it.
      NTFY_URL: http://ntfy:80
      NTFY_TOPIC: sismos
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      # Ubicación real de la casa -- ver daemon/config.py (GMPE) y
      # api/config.py (expuesta de solo lectura en GET /api/config para
      # web/). Un solo lugar (infra/.env, gitignored) para no
      # desincronizar el cálculo del daemon con lo que ve el dashboard.
      # Sin default: `:?` hace que `docker compose up` falle de inmediato
      # si infra/.env no las trae, en vez de arrancar silenciosamente
      # contra un placeholder equivocado (daemon/config.py también lo
      # exige por su cuenta, para quien corra el daemon fuera de compose).
      HOME_LAT: ${HOME_LAT:?falta HOME_LAT en infra/.env}
      HOME_LON: ${HOME_LON:?falta HOME_LON en infra/.env}
    volumes:
      - ./postgres/init:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ntfy:
    # Self-hosted push notifications (daemon/alerts.py). No MQTT/Home
    # Assistant bridge yet -- CLAUDE.md's Fase 5 -- but ntfy's own topic is
    # the clean integration point for that later: anything that can
    # subscribe to an ntfy topic (including a future MQTT bridge) can listen
    # here without daemon-side changes.
    #
    # Runs with auth-default-access=deny-all: nothing can publish or
    # subscribe until a user is explicitly ACL'd on a topic. Required
    # before this is ever exposed past the Docker network (e.g. through
    # Caddy for phone push) -- an unauthenticated topic name is the only
    # thing that would otherwise stop anyone who guesses/finds it from
    # reading alerts or publishing a spoofed one. See infra/ntfy-setup.sh
    # for the one-time bootstrap (creates the daemon's publishing user +
    # token, and a read-only user for phones/the dashboard to subscribe
    # with).
    image: binwiederhier/ntfy
    command: serve
    platform: linux/arm64
    ports:
      - "8081:80"
    restart: unless-stopped
    environment:
      TZ: America/Santiago
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
    volumes:
      - /mnt/data/ntfy:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O /dev/null http://localhost:80/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  api:
    # Same local-build-vs-Pi-pulls-a-prebuilt-image split as `daemon` above.
    build:
      context: ../api
      dockerfile: Dockerfile
    platform: linux/arm64
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sismos:sismos@postgres:5432/sismos
      # Mismos valores que `daemon` arriba -- ver ese comentario, incluido
      # el `:?` (sin default). HOME_LABEL es puramente de presentación
      # (barra superior de web/), sin equivalente en el daemon.
      HOME_LAT: ${HOME_LAT:?falta HOME_LAT en infra/.env}
      HOME_LON: ${HOME_LON:?falta HOME_LON en infra/.env}
      HOME_LABEL: ${HOME_LABEL:-Casa}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    # Same local-build-vs-Pi-pulls-a-prebuilt-image split as `daemon`/`api`
    # above.
    build:
      context: ../web
      dockerfile: Dockerfile
    platform: linux/arm64
    restart: unless-stopped
    environment:
      # El SERVIDOR de Next.js reescribe /api/* hacia acá (ver
      # web/next.config.ts) -- el navegador de la tablet nunca ve esta URL,
      # solo habla con el propio origen de Next.js (puerto 3000). Por eso
      # el nombre del servicio Docker "api" sí funciona acá, a diferencia
      # del extinto NEXT_PUBLIC_API_URL que tenía que resolver desde la
      # LAN de la tablet.
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
